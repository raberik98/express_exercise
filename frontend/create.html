<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/create.js"></script>
<title>Document</title>
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Store</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/store">Store</a>
              </li>
            </ul>
            <form class="d-flex" role="search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
              <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
          </div>
        </div>
      </nav>

      <main class="create-forms">
        <form class="add-coffee-form">
          <div class="mb-3">
            <label for="name" class="form-label">Coffee name</label>
            <input type="text" name="name" placeholder="The name of the coffee..." class="form-control" id="name" aria-describedby="emailHelp">
          </div>
          <div class="mb-3">
            <label for="origin" class="form-label">Coffee origin</label>
            <input type="text" name="origin" placeholder="The origin of the coffee..." class="form-control" id="origin" aria-describedby="emailHelp">
          </div>
          <div class="mb-3">
            <label for="caffeine_content_mg" class="form-label">Caffeine in mg</label>
            <input type="number" name="caffeine_content_mg" placeholder="The Caffeine of the coffee..." class="form-control" id="caffeine_content_mg" aria-describedby="emailHelp">
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">description</label>
            <textarea name="description" placeholder="The description of the coffee..." class="form-control" id="description" aria-describedby="emailHelp"></textarea>
          </div>
          <div class="mb-3">
            <label for="serving_size_ml" class="form-label">serving size in ml</label>
            <input type="number" name="serving_size_ml" placeholder="The serving_size_ml of the coffee..." class="form-control" id="serving_size_ml" aria-describedby="emailHelp">
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </main>
</body>
</html>
